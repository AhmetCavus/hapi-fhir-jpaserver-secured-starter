name: Java CI with Gradle

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "charts/**"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: 21
        distribution: zulu
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build and verify
      run: bash ./gradlew --no-daemon build
