hapi:
  fhir:
    fhir_version: R4
    advanced_lucene_indexing: false
    search_index_full_text_enabled: false
    mdm_enabled: false

# Trust-only defaults for existing test contexts; no production fallback or remote fetch.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:1/realms/test
          jwk-set-uri: http://127.0.0.1:1/realms/test/certs
          audiences: [playground-fhir]
